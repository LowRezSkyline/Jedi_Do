<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>JEDI-do (React)</title>
    <link rel="icon" href="../assets/logo_white.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../vanillajs/css/site.css">
</head>
<body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
    <script type="text/babel" data-type="module">
        const { useState, useEffect, useCallback } = React;

        const API_URI = '/api/JediDoItems';

        function apiFetch(url, options = {}) {
            return fetch(url, { credentials: 'include', ...options }).then(res => {
                if (res.status === 401) {
                    const returnUrl = encodeURIComponent(window.location.pathname);
                    window.location.href = '/login/?returnUrl=' + returnUrl;
                    throw new Error('Unauthorized');
                }
                return res;
            });
        }

        function App() {
            const [items, setItems] = useState([]);
            const [newName, setNewName] = useState('');
            const [newTypeId, setNewTypeId] = useState(1);
            const [editing, setEditing] = useState(null);
            const [editForm, setEditForm] = useState({ id: 0, name: '', completed: false, jediDoTypeId: 1 });

            const loadItems = useCallback(async () => {
                try {
                    const res = await apiFetch(API_URI);
                    setItems(await res.json());
                } catch (e) {
                    if (e.message !== 'Unauthorized') console.error('Unable to get items.', e);
                }
            }, []);

            useEffect(() => { loadItems(); }, [loadItems]);

            const addItem = async (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                try {
                    await apiFetch(API_URI, {
                        method: 'POST',
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newName.trim(), jediDoTypeId: newTypeId, completed: false })
                    });
                    setNewName('');
                    setNewTypeId(1);
                    await loadItems();
                } catch (e) {
                    if (e.message !== 'Unauthorized') console.error('Unable to add item.', e);
                }
            };

            const startEdit = (item) => {
                setEditForm({ id: item.id, name: item.name, completed: item.completed, jediDoTypeId: item.jediDoTypeId });
                setEditing(true);
            };

            const saveEdit = async (e) => {
                e.preventDefault();
                try {
                    await apiFetch(`${API_URI}/${editForm.id}`, {
                        method: 'PUT',
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: editForm.id,
                            name: editForm.name.trim(),
                            completed: editForm.completed,
                            jediDoTypeId: editForm.jediDoTypeId
                        })
                    });
                    setEditing(false);
                    await loadItems();
                } catch (e) {
                    if (e.message !== 'Unauthorized') console.error('Unable to update item.', e);
                }
            };

            const toggleComplete = async (item) => {
                setEditForm({ id: item.id, name: item.name, completed: !item.completed, jediDoTypeId: item.jediDoTypeId });
                try {
                    await apiFetch(`${API_URI}/${item.id}`, {
                        method: 'PUT',
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: item.id,
                            name: item.name,
                            completed: !item.completed,
                            jediDoTypeId: item.jediDoTypeId
                        })
                    });
                    await loadItems();
                } catch (e) {
                    if (e.message !== 'Unauthorized') console.error('Unable to update item.', e);
                }
            };

            const deleteItem = async (id) => {
                try {
                    await apiFetch(`${API_URI}/${id}`, { method: 'DELETE' });
                    await loadItems();
                } catch (e) {
                    if (e.message !== 'Unauthorized') console.error('Unable to delete item.', e);
                }
            };

            const logout = async () => {
                try { await apiFetch('/api/auth/logout', { method: 'POST' }); } catch (_) {}
                window.location.href = '/login/';
            };

            return (
                <>
                    <nav className="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
                        <div className="container-fluid">
                            <a className="navbar-brand" href="#">
                                <table>
                                    <tr>
                                        <td rowSpan="2"><img className="img-fluid logo" src="../assets/logo_white.png" alt="JEDI-do" /></td>
                                        <td><span className="jedido-title-base jedido-name">JEDI-do (React)</span></td>
                                    </tr>
                                    <tr>
                                        <td><div className="jedido-title-base jedido-tag-line">Do or Do Not! There is no try!</div></td>
                                    </tr>
                                </table>
                            </a>
                            <button className="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#reactNav" aria-controls="reactNav" aria-expanded="false" aria-label="Toggle navigation">
                                <span className="navbar-toggler-icon"></span>
                            </button>
                            <div className="collapse navbar-collapse" id="reactNav">
                                <div className="ms-auto d-flex align-items-center gap-1 flex-wrap">
                                    <div className="dropdown">
                                        <button className="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="reactSwitchUi" data-bs-toggle="dropdown" aria-expanded="false">Switch UI</button>
                                        <ul className="dropdown-menu dropdown-menu-end" aria-labelledby="reactSwitchUi">
                                            <li><a className="dropdown-item" href="/angular/">Angular</a></li>
                                            <li><a className="dropdown-item active" href="/react/">React</a></li>
                                            <li><a className="dropdown-item" href="/svelte/">Svelte</a></li>
                                            <li><a className="dropdown-item" href="/vanillajs/">VanillaJS</a></li>
                                            <li><a className="dropdown-item" href="/vue/">Vue</a></li>
                                        </ul>
                                    </div>
                                    <button type="button" className="btn btn-outline-light btn-sm" onClick={logout}>Logout</button>
                                </div>
                            </div>
                        </div>
                    </nav>

                    <section className="todo">
                        <div className="table-responsive">
                        <table className="table table-striped table-light" style={{ marginTop: '58px' }}>
                            <tbody>
                                {items.map(item => (
                                    <tr key={item.id}>
                                        <td className="center jedido-checkbox">
                                            <input type="checkbox" className="jedido-checkbox" checked={item.completed} onChange={() => toggleComplete(item)} />
                                        </td>
                                        <td className="task-item">{item.jediDoType} {item.name}</td>
                                        <td className="jedido-edit-controls">
                                            <button type="button" className="btn btn-sm btn-dark" onClick={() => startEdit(item)}>edit</button>
                                        </td>
                                        <td className="jedido-edit-controls">
                                            <button type="button" className="btn btn-sm btn-dark" onClick={() => deleteItem(item.id)}>x</button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                            <tbody>
                                {!editing ? (
                                    <tr>
                                        <td colSpan="4" className="bg-light">
                                            <form onSubmit={addItem}>
                                                <table cellSpacing="0" cellPadding="0" className="bg-light">
                                                    <tr>
                                                        <td></td>
                                                        <td>
                                                            <input type="text" value={newName} onChange={e => setNewName(e.target.value)} className="form-control jedido-add-textbox" placeholder="New to-do" />
                                                            <br />
                                                            <select value={newTypeId} onChange={e => setNewTypeId(Number(e.target.value))} className="form-control jedido-drop-down">
                                                                <option value={1}>Do!</option>
                                                                <option value={2}>Not Do!</option>
                                                            </select>
                                                        </td>
                                                        <td>
                                                            <button type="submit" className="btn btn-dark btn-sm" disabled={!newName.trim()}>Add</button>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </form>
                                        </td>
                                    </tr>
                                ) : (
                                    <tr>
                                        <td colSpan="4" style={{ backgroundColor: '#fff' }}>
                                            <form onSubmit={saveEdit}>
                                                <table cellSpacing="0" cellPadding="0">
                                                    <tr>
                                                        <td><input type="checkbox" checked={editForm.completed} onChange={e => setEditForm({ ...editForm, completed: e.target.checked })} /></td>
                                                        <td>
                                                            <input type="text" value={editForm.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} className="form-control jedido-textbox" />
                                                            <br />
                                                            <select value={editForm.jediDoTypeId} onChange={e => setEditForm({ ...editForm, jediDoTypeId: Number(e.target.value) })} className="form-control jedido-drop-down">
                                                                <option value={1}>Do!</option>
                                                                <option value={2}>Not Do!</option>
                                                            </select>
                                                        </td>
                                                        <td>
                                                            <button type="submit" className="btn btn-sm btn-dark">Save</button>
                                                            <a href="#" className="ms-1" onClick={e => { e.preventDefault(); setEditing(false); }}>&#10006;</a>
                                                        </td>
                                                    </tr>
                                                </table>
                                            </form>
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                            <tbody>
                                <tr>
                                    <td colSpan="4"><p className="mb-0">Total Records: {items.length}</p></td>
                                </tr>
                            </tbody>
                        </table>
                        </div>
                    </section>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
