<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>JEDI-do (Vue)</title>
    <link rel="icon" href="../assets/logo_white.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../vanillajs/css/site.css">
</head>
<body>
    <div id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <table>
                        <tr>
                            <td rowspan="2"><img class="img-fluid logo" src="../assets/logo_white.png" alt="JEDI-do"></td>
                            <td><span class="jedido-title-base jedido-name">JEDI-do (Vue)</span></td>
                        </tr>
                        <tr>
                            <td><div class="jedido-title-base jedido-tag-line">Do or Do Not! There is no try!</div></td>
                        </tr>
                    </table>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#vueNav" aria-controls="vueNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="vueNav">
                    <div class="ms-auto d-flex align-items-center gap-1 flex-wrap">
                        <div class="dropdown">
                            <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="vueSwitchUi" data-bs-toggle="dropdown" aria-expanded="false">Switch UI</button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="vueSwitchUi">
                                <li><a class="dropdown-item" href="/angular/">Angular</a></li>
                                <li><a class="dropdown-item" href="/react/">React</a></li>
                                <li><a class="dropdown-item" href="/svelte/">Svelte</a></li>
                                <li><a class="dropdown-item" href="/vanillajs/">VanillaJS</a></li>
                                <li><a class="dropdown-item active" href="/vue/">Vue</a></li>
                            </ul>
                        </div>
                        <button type="button" class="btn btn-outline-light btn-sm" @click="logout">Logout</button>
                    </div>
                </div>
            </div>
        </nav>

        <section class="todo">
            <div class="table-responsive">
            <table class="table table-striped table-light" style="margin-top: 58px;">
                <tbody>
                    <tr v-for="item in items" :key="item.id">
                        <td class="center jedido-checkbox">
                            <input type="checkbox" class="jedido-checkbox" :checked="item.completed" @change="toggleComplete(item)">
                        </td>
                        <td class="task-item">{{ item.jediDoType }} {{ item.name }}</td>
                        <td class="jedido-edit-controls">
                            <button type="button" class="btn btn-sm btn-dark" @click="startEdit(item)">edit</button>
                        </td>
                        <td class="jedido-edit-controls">
                            <button type="button" class="btn btn-sm btn-dark" @click="deleteItem(item.id)">x</button>
                        </td>
                    </tr>
                </tbody>
                <tr v-if="!editing">
                    <td colspan="4" class="bg-light">
                        <form @submit.prevent="addItem">
                            <table cellspacing="0" cellpadding="0" class="bg-light">
                                <tr>
                                    <td></td>
                                    <td>
                                        <input type="text" v-model="newName" class="form-control jedido-add-textbox" placeholder="New to-do">
                                        <br>
                                        <select v-model="newTypeId" class="form-control jedido-drop-down">
                                            <option :value="1">Do!</option>
                                            <option :value="2">Not Do!</option>
                                        </select>
                                    </td>
                                    <td>
                                        <button type="submit" class="btn btn-dark btn-sm" :disabled="!newName.trim()">Add</button>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </td>
                </tr>
                <tr v-if="editing">
                    <td colspan="4" style="background-color: #fff;">
                        <form @submit.prevent="saveEdit">
                            <table cellspacing="0" cellpadding="0">
                                <tr>
                                    <td><input type="checkbox" v-model="editForm.completed"></td>
                                    <td>
                                        <input type="text" v-model="editForm.name" class="form-control jedido-textbox">
                                        <br>
                                        <select v-model="editForm.jediDoTypeId" class="form-control jedido-drop-down">
                                            <option :value="1">Do!</option>
                                            <option :value="2">Not Do!</option>
                                        </select>
                                    </td>
                                    <td>
                                        <button type="submit" class="btn btn-sm btn-dark">Save</button>
                                        <a href="#" class="ms-1" @click.prevent="editing = false">&#10006;</a>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </td>
                </tr>
                <tr>
                    <td colspan="4"><p class="mb-0">Total Records: {{ items.length }}</p></td>
                </tr>
            </table>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    uri: '/api/JediDoItems',
                    items: [],
                    newName: '',
                    newTypeId: 1,
                    editing: false,
                    editForm: { id: 0, name: '', completed: false, jediDoTypeId: 1 }
                };
            },
            mounted() {
                this.loadItems();
            },
            methods: {
                async apiFetch(url, options = {}) {
                    const res = await fetch(url, { credentials: 'include', ...options });
                    if (res.status === 401) {
                        const returnUrl = encodeURIComponent(window.location.pathname);
                        window.location.href = '/login/?returnUrl=' + returnUrl;
                        throw new Error('Unauthorized');
                    }
                    return res;
                },
                async loadItems() {
                    try {
                        const res = await this.apiFetch(this.uri);
                        this.items = await res.json();
                    } catch (e) {
                        if (e.message !== 'Unauthorized') console.error('Unable to get items.', e);
                    }
                },
                async addItem() {
                    if (!this.newName.trim()) return;
                    try {
                        await this.apiFetch(this.uri, {
                            method: 'POST',
                            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: this.newName.trim(), jediDoTypeId: this.newTypeId, completed: false })
                        });
                        this.newName = '';
                        this.newTypeId = 1;
                        await this.loadItems();
                    } catch (e) {
                        if (e.message !== 'Unauthorized') console.error('Unable to add item.', e);
                    }
                },
                startEdit(item) {
                    this.editForm = { id: item.id, name: item.name, completed: item.completed, jediDoTypeId: item.jediDoTypeId };
                    this.editing = true;
                },
                async saveEdit() {
                    try {
                        await this.apiFetch(`${this.uri}/${this.editForm.id}`, {
                            method: 'PUT',
                            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id: this.editForm.id,
                                name: this.editForm.name.trim(),
                                completed: this.editForm.completed,
                                jediDoTypeId: this.editForm.jediDoTypeId
                            })
                        });
                        this.editing = false;
                        await this.loadItems();
                    } catch (e) {
                        if (e.message !== 'Unauthorized') console.error('Unable to update item.', e);
                    }
                },
                async toggleComplete(item) {
                    this.editForm = { id: item.id, name: item.name, completed: !item.completed, jediDoTypeId: item.jediDoTypeId };
                    await this.saveEdit();
                },
                async deleteItem(id) {
                    try {
                        await this.apiFetch(`${this.uri}/${id}`, { method: 'DELETE' });
                        await this.loadItems();
                    } catch (e) {
                        if (e.message !== 'Unauthorized') console.error('Unable to delete item.', e);
                    }
                },
                async logout() {
                    try {
                        await this.apiFetch('/api/auth/logout', { method: 'POST' });
                    } catch (_) {}
                    window.location.href = '/login/';
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
