<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>JEDI-do (Svelte)</title>
    <link rel="icon" href="../assets/logo_white.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../vanillajs/css/site.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img class="logo me-2" src="../assets/logo_white.png" alt="JEDI-do">
                <div>
                    <span class="jedido-name">JEDI-do (Svelte)</span>
                    <div class="jedido-tag-line">Do or Do Not! There is no try!</div>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#svelteNav" aria-controls="svelteNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="svelteNav">
                <div class="ms-auto d-flex align-items-center gap-1 flex-wrap">
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="svelteSwitchUi" data-bs-toggle="dropdown" data-bs-display="dynamic" data-bs-boundary="viewport" aria-expanded="false">Switch UI</button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="svelteSwitchUi">
                            <li><a class="dropdown-item" href="/angular/">Angular</a></li>
                            <li><a class="dropdown-item" href="/react/">React</a></li>
                            <li><a class="dropdown-item active" href="/svelte/">Svelte</a></li>
                            <li><a class="dropdown-item" href="/vanillajs/">VanillaJS</a></li>
                            <li><a class="dropdown-item" href="/vue/">Vue</a></li>
                        </ul>
                    </div>
                    <a href="#" id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container py-4">
            <!-- Add new item form -->
            <div id="addForm" class="card shadow-sm mb-4">
                <div class="card-body">
                    <form id="addFormEl" action="javascript:void(0);" method="POST" class="row g-2 flex-md-row flex-column align-items-end">
                        <div class="col-md-6">
                            <label for="add-name" class="form-label visually-hidden">New to-do</label>
                            <input type="text" id="add-name" class="form-control" placeholder="What must you do (or not do)?">
                        </div>
                        <div class="col-md-3">
                            <label for="add-type" class="form-label visually-hidden">Type</label>
                            <select id="add-type" class="form-select">
                                <option value="1">Do!</option>
                                <option value="2">Not Do!</option>
                            </select>
                        </div>
                        <div class="col-md-3 col-auto">
                            <button id="btnAdd" type="submit" class="btn btn-primary w-100" disabled>Add</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Edit item form (hidden by default) - text and type only -->
            <div id="editForm" class="card shadow-sm mb-4 jedido-edit-card" style="display: none;">
                <div class="card-body">
                    <form id="editFormEl" action="javascript:void(0);" class="row g-2 flex-md-row flex-column align-items-end">
                        <input type="hidden" id="edit-id">
                        <div class="col-md-6">
                            <label for="edit-name" class="form-label visually-hidden">Item name</label>
                            <input type="text" id="edit-name" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <select id="edit-type" class="form-select">
                                <option value="1">Do!</option>
                                <option value="2">Not Do!</option>
                            </select>
                        </div>
                        <div class="col-md-3 col-auto d-flex gap-1">
                            <button type="submit" class="btn btn-primary btn-sm">Save</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="closeEdit" aria-label="Cancel">×</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Todo list -->
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Your Items</h5>
                    <span id="counter" class="badge bg-secondary">0 items</span>
                </div>
                <ul id="todos" class="list-group list-group-flush"></ul>
            </div>
        </div>
    </main>

    <!-- Delete confirmation modal -->
    <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="deleteConfirmModalLabel">Delete Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-0">
                    <p class="mb-0">Are you sure you want to delete <strong id="deleteItemName"></strong>? This cannot be undone.</p>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="deleteConfirmBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="js/site.js"></script>
</body>
</html>
