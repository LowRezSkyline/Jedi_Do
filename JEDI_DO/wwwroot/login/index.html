<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>JEDI-do — Login</title>
    <link rel="icon" href="../assets/logo_white.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body { padding-top: 3rem; max-width: 400px; margin: 0 auto; }
        .login-title { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <h1 class="login-title">JEDI-do</h1>
    <p class="text-muted">Do or Do Not. There is no try.</p>
    <form id="loginForm">
        <div class="mb-3">
            <label for="username" class="form-label">User</label>
            <input type="text" id="username" name="username" class="form-control" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        <div id="error" class="alert alert-danger d-none" role="alert"></div>
        <button type="submit" class="btn btn-dark">Login</button>
    </form>

    <script>
        function getReturnUrl() {
            const params = new URLSearchParams(window.location.search);
            const returnUrl = params.get('returnUrl') || '';
            if (returnUrl.startsWith('/') && !returnUrl.startsWith('//')) return returnUrl;
            return '/';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('error');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });
                if (res.ok) {
                    window.location.href = getReturnUrl();
                    return;
                }
                const text = await res.text();
                errorEl.textContent = res.status === 401 ? 'Invalid username or password.' : (text || 'Login failed.');
                errorEl.classList.remove('d-none');
            } catch (err) {
                errorEl.textContent = 'Network error. Try again.';
                errorEl.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
