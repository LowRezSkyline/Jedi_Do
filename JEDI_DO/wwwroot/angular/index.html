<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>JEDI-do (Angular)</title>
    <link rel="icon" href="../assets/logo_white.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="../vanillajs/css/site.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <table>
                    <tr>
                        <td rowspan="2"><img class="img-fluid logo" src="../assets/logo_white.png" alt="JEDI-do"></td>
                        <td><span class="jedido-title-base jedido-name">JEDI-do (Angular)</span></td>
                    </tr>
                    <tr>
                        <td><div class="jedido-title-base jedido-tag-line">Do or Do Not! There is no try!</div></td>
                    </tr>
                </table>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#angularNav" aria-controls="angularNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="angularNav">
                <div class="ms-auto d-flex align-items-center gap-1 flex-wrap">
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="angularSwitchUi" data-bs-toggle="dropdown" aria-expanded="false">Switch UI</button>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="angularSwitchUi">
                            <li><a class="dropdown-item active" href="/angular/">Angular</a></li>
                            <li><a class="dropdown-item" href="/react/">React</a></li>
                            <li><a class="dropdown-item" href="/svelte/">Svelte</a></li>
                            <li><a class="dropdown-item" href="/vanillajs/">VanillaJS</a></li>
                            <li><a class="dropdown-item" href="/vue/">Vue</a></li>
                        </ul>
                    </div>
                    <a href="#" id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="todo">
        <div class="table-responsive">
        <table class="table table-striped table-light" style="margin-top: 58px;">
            <tbody id="todos"></tbody>
            <tr>
                <td colspan="4" id="addForm" class="bg-light">
                    <form id="addFormEl" action="javascript:void(0);" method="POST">
                        <table cellspacing="0" cellpadding="0" class="bg-light">
                            <tr>
                                <td></td>
                                <td>
                                    <input type="text" id="add-name" class="form-control jedido-add-textbox" placeholder="New to-do">
                                    <br>
                                    <select id="add-type" class="form-control jedido-drop-down">
                                        <option value="1">Do!</option>
                                        <option value="2">Not Do!</option>
                                    </select>
                                </td>
                                <td><input id="btnAdd" type="submit" value="Add" disabled class="btn btn-dark btn-sm"></td>
                            </tr>
                        </table>
                    </form>
                </td>
            </tr>
            <tr id="editForm" style="background-color: #fff; display: none;">
                <td colspan="4">
                    <form id="editFormEl" action="javascript:void(0);">
                        <input type="hidden" id="edit-id">
                        <table cellspacing="0" cellpadding="0">
                            <tr>
                                <td><input type="checkbox" id="edit-Completed"></td>
                                <td>
                                    <input type="text" id="edit-name" class="form-control jedido-textbox">
                                    <br>
                                    <select id="edit-type" class="form-control jedido-drop-down">
                                        <option value="1">Do!</option>
                                        <option value="2">Not Do!</option>
                                    </select>
                                </td>
                                <td>
                                    <input type="submit" value="Save" class="btn btn-sm btn-dark">
                                    <a href="#" id="closeEdit" aria-label="Close">&#10006;</a>
                                </td>
                            </tr>
                        </table>
                    </form>
                </td>
            </tr>
            <tr>
                <td colspan="4"><p id="counter" class="mb-0"></p></td>
            </tr>
        </table>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        const uri = '/api/JediDoItems';
        const authUri = '/api/auth';
        let todos = [];

        const apiFetch = (url, options = {}) => fetch(url, { credentials: 'include', ...options }).then(res => {
            if (res.status === 401) { window.location.href = '/login/?returnUrl=' + encodeURIComponent(window.location.pathname); throw new Error('Unauthorized'); }
            return res;
        });

        document.getElementById('logoutBtn').onclick = () => apiFetch(authUri + '/logout', { method: 'POST' }).then(() => location.href = '/login/').catch(() => location.href = '/login/');

        const getItems = () => apiFetch(uri).then(r => r.json()).then(displayItems).catch(e => { if (e.message !== 'Unauthorized') console.error('Unable to get items.', e); });

        function displayItems(data) {
            const tBody = document.getElementById('todos');
            tBody.innerHTML = '';
            document.getElementById('counter').textContent = 'Total Records: ' + data.length;
            data.forEach(item => {
                const tr = tBody.insertRow();
                const cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'jedido-checkbox'; cb.checked = item.completed; cb.onclick = () => checkboxClick(item);
                const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.className = 'btn btn-sm btn-dark'; editBtn.textContent = 'edit'; editBtn.onclick = () => displayEditForm(item.id);
                const delBtn = document.createElement('button'); delBtn.type = 'button'; delBtn.className = 'btn btn-sm btn-dark'; delBtn.textContent = 'x'; delBtn.onclick = () => deleteItem(item.id);
                tr.insertCell(0).appendChild(cb); tr.cells[0].className = 'center jedido-checkbox';
                tr.insertCell(1).appendChild(document.createTextNode(item.jediDoType + ' ' + item.name)); tr.cells[1].className = 'task-item';
                tr.insertCell(2).appendChild(editBtn); tr.cells[2].className = 'jedido-edit-controls';
                tr.insertCell(3).appendChild(delBtn); tr.cells[3].className = 'jedido-edit-controls';
            });
            todos = data;
        }

        document.getElementById('add-name').addEventListener('input', () => { document.getElementById('btnAdd').disabled = !document.getElementById('add-name').value.trim(); });

        document.getElementById('addFormEl').onsubmit = (e) => {
            e.preventDefault();
            const name = document.getElementById('add-name').value.trim();
            const typeId = parseInt(document.getElementById('add-type').value, 10);
            if (!name) return;
            apiFetch(uri, { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify({ name, jediDoTypeId: typeId, completed: false }) })
                .then(r => r.json()).then(() => { getItems(); document.getElementById('add-name').value = ''; document.getElementById('btnAdd').disabled = true; document.getElementById('add-type').selectedIndex = 0; })
                .catch(e => { if (e.message !== 'Unauthorized') console.error('Unable to add item.', e); });
        };

        function displayEditForm(id) {
            if (id < 1) { document.getElementById('addForm').closest('tr').style.display = ''; document.getElementById('editForm').style.display = 'none'; return; }
            const item = todos.find(i => i.id === id);
            document.getElementById('edit-name').value = item.name; document.getElementById('edit-id').value = item.id; document.getElementById('edit-Completed').checked = item.completed;
            document.getElementById('edit-type').value = item.jediDoTypeId; document.getElementById('editForm').style.display = ''; document.getElementById('addForm').closest('tr').style.display = 'none';
        }

        document.getElementById('editFormEl').onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const item = { id: parseInt(id, 10), name: document.getElementById('edit-name').value.trim(), completed: document.getElementById('edit-Completed').checked, jediDoTypeId: parseInt(document.getElementById('edit-type').value, 10) };
            apiFetch(uri + '/' + id, { method: 'PUT', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify(item) })
                .then(() => { getItems(); displayEditForm(0); document.getElementById('editForm').style.display = 'none'; document.getElementById('addForm').closest('tr').style.display = ''; })
                .catch(e => { if (e.message !== 'Unauthorized') console.error('Unable to update item.', e); });
        };

        document.getElementById('closeEdit').onclick = (e) => { e.preventDefault(); document.getElementById('editForm').style.display = 'none'; displayEditForm(0); document.getElementById('addForm').closest('tr').style.display = ''; };

        function checkboxClick(item) {
            const payload = { id: item.id, name: item.name, completed: !item.completed, jediDoTypeId: item.jediDoTypeId };
            apiFetch(uri + '/' + item.id, { method: 'PUT', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then(() => getItems()).catch(e => { if (e.message !== 'Unauthorized') console.error(e); });
        }

        function deleteItem(id) {
            apiFetch(uri + '/' + id, { method: 'DELETE' }).then(() => getItems()).catch(e => { if (e.message !== 'Unauthorized') console.error('Unable to delete item.', e); });
        }

        getItems();
    </script>
</body>
</html>
