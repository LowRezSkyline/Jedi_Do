<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>JEDI-do</title>
    <link rel="icon" href="../assets/logo_white.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/site.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand" href="#">
            <table>
                <tr>
                    <td rowspan="2"><img class="img-fluid logo" src="../assets/logo_white.png" alt="JEDI-do"></td>
                    <td><span class="jedido-title-base jedido-name">JEDI-do</span></td>
                </tr>
                <tr>
                    <td><div class="jedido-title-base jedido-tag-line">Do or Do Not! There is no try!</div></td>
                </tr>
            </table>
        </a>
        <div class="ms-auto">
            <a href="#" onclick="logout(); return false;" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <section class="todo">
        <table class="table table-striped table-light" style="margin-top: 58px;">
            <tbody id="todos"></tbody>
            <tr>
                <td colspan="4" id="addForm" class="bg-light">
                    <div>
                        <form action="javascript:void(0);" method="POST" onsubmit="save(0)">
                            <table cellspacing="0" cellpadding="0" class="bg-light">
                                <tr>
                                    <td></td>
                                    <td>
                                        <input type="text" id="add-name" class="form-control jedido-add-textbox" placeholder="New to-do">
                                        <br>
                                        <select id="add-type" class="form-control jedido-drop-down">
                                            <option value="1">Do!</option>
                                            <option value="2">Not Do!</option>
                                        </select>
                                    </td>
                                    <td><input id="btnAdd" type="submit" value="Add" disabled class="btn btn-dark btn-sm"></td>
                                </tr>
                            </table>
                        </form>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="4" id="editForm" style="background-color: #fff;">
                    <div>
                        <form action="javascript:void(0);" onsubmit="save(1)">
                            <input type="hidden" id="edit-id">
                            <table cellspacing="0" cellpadding="0">
                                <tr>
                                    <td><input type="checkbox" id="edit-Completed"></td>
                                    <td>
                                        <input type="text" id="edit-name" class="form-control jedido-textbox">
                                        <br>
                                        <select id="edit-type" class="form-control jedido-drop-down">
                                            <option value="1">Do!</option>
                                            <option value="2">Not Do!</option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="submit" value="Save" class="btn btn-sm btn-dark">
                                        <a onclick="closeInput()" aria-label="Close">&#10006;</a>
                                    </td>
                                </tr>
                            </table>
                        </form>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="4">
                    <p id="counter"></p>
                </td>
            </tr>
        </table>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3LHB60JOkm5q9W8rSvfQJXqwSDxyCFdGJdNE/CGYQcAuPhPZEVydkJd" crossorigin="anonymous"></script>
    <script src="js/site.js"></script>
    <script>Init();</script>
</body>
</html>
